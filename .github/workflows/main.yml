name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force KSP and Gradle Settings
        run: |
          touch gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.use.daemon=false" >> gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-parallel

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anamol-Wifi-APK
          path: app/build/outputs/apk/debug/*.apk
          
